<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deep Cut</title>
  <meta name="description" content="A daily trivia game where the rarest correct answer flies furthest.">
  <meta name="theme-color" content="#0a0b1e">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/vt323.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="page">
    <header class="masthead">
      <a class="wordmark" href="#" data-action="home" aria-label="Deep Cut, home"><span id="logo"></span>DEEP CUT</a>
      <div class="head-right">
        <p class="dateline" id="dateline"></p>
        <button class="sound" id="sound" type="button" data-action="sound" aria-pressed="true">SFX ON</button>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer class="colophon">
      <p>Popularity figures are editorial estimates of how 100 people would answer, not survey data.
        <span id="judge-note"></span></p>
    </footer>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
